<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin sinh viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <header class="card-header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="7" r="4"></circle>
                    <path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2z"></path>
                </svg>
            </div>
            <div>
                <h1>Thông tin sinh viên</h1>
                <p>Thêm mới hồ sơ sinh viên vào hệ thống</p>
            </div>
        </header>

        <form action="#" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label for="student-id">Mã sinh viên <span class="required">*</span></label>
                    <input type="text" id="student-id" name="studentId" placeholder="VD: SV001" required>
                </div>

                <div class="form-group">
                    <label for="full-name">Họ và tên <span class="required">*</span></label>
                    <input type="text" id="full-name" name="fullName" placeholder="Nguyễn Văn An" required>
                </div>

                <div class="form-group">
                    <label for="birthday">Ngày sinh <span class="required">*</span></label>
                    <input type="date" id="birthday" name="birthday" required>
                </div>

                <div class="form-group">
                    <label for="gender">Giới tính <span class="required">*</span></label>
                    <select id="gender" name="gender" required>
                        <option value="" disabled selected>Chọn giới tính</option>
                        <option value="male">Nam</option>
                        <option value="female">Nữ</option>
                        <option value="other">Khác</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="09xxxxxxxx"
                        pattern="0[0-9]{9}" title="Số điện thoại gồm 10 chữ số, bắt đầu bằng 0" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="reset" class="btn btn-secondary">Làm mới</button>
                <button type="submit" class="btn btn-primary">✓ Lưu thông tin</button>
            </div>
        </form>
    </main>
</body>
</html>
